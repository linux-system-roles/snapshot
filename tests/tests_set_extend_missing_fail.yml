---
- name: Verify extend fails for a volume not in the original snapshot set
  hosts: all
  vars:
    # only use vgs matching this pattern
    snapshot_lvm_vg_include: "^test_"
    test_disk_min_size: "1g"
    test_disk_count: 10
    test_storage_pools:
      - name: test_vg1
        disks: "{{ range(0, 3) | map('extract', unused_disks) | list }}"
        volumes:
          - name: lv1
            size: "30%"
          - name: lv2
            size: "30%"
      - name: test_vg2
        disks: "{{ range(3, 6) | map('extract', unused_disks) | list }}"
        volumes:
          - name: lv3
            size: "30%"
    # test_vg1/lv2 is deliberately left out of the snapshot set
    snapshot_test_set:
      name: snapset1
      volumes:
        - name: snapshot VG1 LV1
          vg: test_vg1
          lv: lv1
          percent_space_required: 40
        - name: snapshot VG2 LV3
          vg: test_vg2
          lv: lv3
          percent_space_required: 40
    # only the volume that has no snapshot in the set
    snapshot_missing_only_set:
      name: snapset1
      volumes:
        - name: snapshot VG1 LV2
          vg: test_vg1
          lv: lv2
          percent_space_required: 40
    # the original request with the volume that has no snapshot added to it.
    # The volumes that do have a snapshot ask for the size they already have,
    # so the missing volume is the only thing the role can act on and the
    # result does not depend on the order of the list.
    snapshot_missing_extend_set:
      name: snapset1
      volumes:
        - name: snapshot VG1 LV1
          vg: test_vg1
          lv: lv1
          percent_space_required: 40
        - name: snapshot VG1 LV2
          vg: test_vg1
          lv: lv2
          percent_space_required: 40
        - name: snapshot VG2 LV3
          vg: test_vg2
          lv: lv3
          percent_space_required: 40
  tasks:
    - name: Run tests
      block:
        - name: Setup
          include_tasks: tasks/setup.yml

        - name: Run the snapshot role to create a snapshot set of LVs
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            snapshot_lvm_action: snapshot
            snapshot_lvm_set: "{{ snapshot_test_set }}"

        - name: Verify the set of snapshots for the LVs
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            snapshot_lvm_action: check
            snapshot_lvm_set: "{{ snapshot_test_set }}"
            snapshot_lvm_verify_only: true

        - name: Test failure extending only a volume that has no snapshot
          include_tasks: verify-role-failed.yml
          vars:
            __snapshot_failed_regex: "snapshot not found"
            __snapshot_failed_msg:
              Role did not fail to extend a volume with no snapshot in the set
            __snapshot_failed_params:
              snapshot_lvm_action: extend
              __snapshot_lvm_set: "{{ snapshot_missing_only_set }}"
            __snapshot_failed_changed: false

        - name: Test failure extending a set that includes a volume with no snapshot
          include_tasks: verify-role-failed.yml
          vars:
            __snapshot_failed_regex: "snapshot not found"
            __snapshot_failed_msg:
              Role did not fail to extend a set with a volume missing from it
            __snapshot_failed_params:
              snapshot_lvm_action: extend
              __snapshot_lvm_set: "{{ snapshot_missing_extend_set }}"
            __snapshot_failed_changed: false

        - name: Test failure extend verify for a volume with no snapshot
          include_tasks: verify-role-failed.yml
          vars:
            __snapshot_failed_regex: "snapshot not found"
            __snapshot_failed_msg:
              Extend verify did not fail for a volume missing from the set
            __snapshot_failed_params:
              snapshot_lvm_action: extend
              snapshot_lvm_verify_only: true
              __snapshot_lvm_set: "{{ snapshot_missing_extend_set }}"
            __snapshot_failed_changed: false

        - name: Verify the original snapshot set is unchanged
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            snapshot_lvm_action: check
            snapshot_lvm_set: "{{ snapshot_test_set }}"
            snapshot_lvm_verify_only: true

        - name: Verify extend still succeeds for the volumes that are in the set
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            snapshot_lvm_action: extend
            snapshot_lvm_set: "{{ snapshot_test_set }}"
            snapshot_lvm_verify_only: true

        - name: Assert no changes for extend verify
          assert:
            that: not snapshot_cmd["changed"]

        - name: Run the snapshot role remove the set
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            snapshot_lvm_action: remove
            snapshot_lvm_set: "{{ snapshot_test_set }}"

        - name: Run the snapshot role to verify the set is removed
          include_tasks: tasks/run_role_with_clear_facts.yml
          vars:
            snapshot_lvm_action: remove
            snapshot_lvm_set: "{{ snapshot_test_set }}"
            snapshot_lvm_verify_only: true

      always:
        - name: Cleanup
          include_tasks: tasks/cleanup.yml
          tags: tests::cleanup
